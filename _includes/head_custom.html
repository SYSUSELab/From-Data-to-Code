<script>
(function () {
  var storageKey = "fdtc-theme";
  var savedTheme = null;

  try {
    savedTheme = localStorage.getItem(storageKey);
  } catch (error) {}

  var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  var theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : (prefersLight ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>
<link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
<script>
document.addEventListener("DOMContentLoaded", function () {
  var storageKey = "fdtc-theme";
  var root = document.documentElement;
  var toggle = document.createElement("button");

  function currentTheme() {
    return root.getAttribute("data-theme") === "light" ? "light" : "dark";
  }

  function applyTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    toggle.setAttribute("aria-pressed", theme === "light" ? "true" : "false");
    toggle.setAttribute("aria-label", theme === "light" ? "Switch to dark mode" : "Switch to light mode");
    toggle.title = theme === "light" ? "Switch to dark mode" : "Switch to light mode";
    toggle.innerHTML = '<span class="theme-toggle__icon" aria-hidden="true">' + (theme === "light" ? "☀" : "☾") + '</span><span>' + (theme === "light" ? "Light" : "Dark") + '</span>';

    if (persist) {
      try {
        localStorage.setItem(storageKey, theme);
      } catch (error) {}
    }
  }

  function enhancePaperLists() {
    var cards = Array.prototype.slice.call(document.querySelectorAll(".main-content > .paper-card"));
    var groups = [];
    var group = [];

    cards.forEach(function (card) {
      var previous = card.previousElementSibling;

      if (group.length && previous && previous.classList.contains("paper-card")) {
        group.push(card);
        return;
      }

      if (group.length) {
        groups.push(group);
      }

      group = [card];
    });

    if (group.length) {
      groups.push(group);
    }

    groups.forEach(function (items) {
      if (items.length < 2) {
        return;
      }

      var grid = document.createElement("div");
      grid.className = "paper-grid";
      items[0].parentNode.insertBefore(grid, items[0]);

      items.forEach(function (item, index) {
        if (index >= 12) {
          item.classList.add("is-collapsed");
        }
        grid.appendChild(item);
      });

      if (items.length <= 12) {
        return;
      }

      var button = document.createElement("button");
      button.type = "button";
      button.className = "paper-grid-toggle";
      button.textContent = "Show all " + items.length + " papers";
      button.addEventListener("click", function () {
        var expanded = button.getAttribute("aria-expanded") === "true";
        items.slice(12).forEach(function (item) {
          item.classList.toggle("is-collapsed", expanded);
        });
        button.setAttribute("aria-expanded", expanded ? "false" : "true");
        button.textContent = expanded ? "Show all " + items.length + " papers" : "Show fewer papers";
      });
      button.setAttribute("aria-expanded", "false");
      grid.parentNode.insertBefore(button, grid.nextSibling);
    });
  }

  toggle.type = "button";
  toggle.className = "theme-toggle";
  toggle.addEventListener("click", function () {
    applyTheme(currentTheme() === "light" ? "dark" : "light", true);
  });

  document.body.appendChild(toggle);
  applyTheme(currentTheme(), false);
  enhancePaperLists();
});
</script>
