<script>
(function () {
  var storageKey = "fdtc-theme";
  var savedTheme = null;

  try {
    savedTheme = localStorage.getItem(storageKey);
  } catch (error) {}

  var prefersLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  var theme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : (prefersLight ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<style>

    --bg-page: #0d1117 !important;
    --bg-sidebar: #0d1117 !important;
    --bg-card: #161b22 !important;
    --bg-card-hover: #1f2630 !important;

    --text-strong: #f0f6fc !important;

    --bg-card: #ffffff !important;
    --bg-card-hover: #f1f6ff !important;

    --accent-green: #1a7f37 !important;

    --shadow-card-hover: 0 12px 30px rgba(9, 105, 218, 0.16) !important;

    --tag-border: rgba(9, 105, 218, 0.22) !important;
    --abstract-bg: linear-gradient(135deg, rgba(9, 105, 218, 0.08) 0%, rgba(130, 80, 223, 0.08) 100%) !important;
    --heading-color: #0f172a !important;
    --button-primary-bg: #0969da !important;
    --button-primary-border: #0969da !important;
    --button-primary-text: #ffffff !important;
    --button-secondary-bg: #ffffff !important;
    --button-secondary-text: #0969da !important;

html, body {

.main-content p code,

</style>

<script>
document.addEventListener("DOMContentLoaded", function () {
  var storageKey = "fdtc-theme";
  var root = document.documentElement;
  var toggle = document.createElement("button");

  function currentTheme() {
    return root.getAttribute("data-theme") === "light" ? "light" : "dark";
  }

  function applyTheme(theme, persist) {
    root.setAttribute("data-theme", theme);
    toggle.setAttribute("aria-pressed", theme === "light" ? "true" : "false");
    toggle.setAttribute("aria-label", theme === "light" ? "Switch to dark mode" : "Switch to light mode");
    toggle.title = theme === "light" ? "Switch to dark mode" : "Switch to light mode";
    toggle.innerHTML = '<span class="theme-toggle__icon" aria-hidden="true">' + (theme === "light" ? "☀" : "☾") + '</span><span>' + (theme === "light" ? "Light" : "Dark") + '</span>';

    if (persist) {
      try {
        localStorage.setItem(storageKey, theme);
      } catch (error) {}
    }
  }

  toggle.type = "button";
  toggle.className = "theme-toggle";
  toggle.addEventListener("click", function () {
    applyTheme(currentTheme() === "light" ? "dark" : "light", true);
  });

  document.body.appendChild(toggle);
  applyTheme(currentTheme(), false);
});
</script>
