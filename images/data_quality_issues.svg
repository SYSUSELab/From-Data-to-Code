<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">Training-data quality headings</title><desc id="desc">Seven code-attribute headings and six non-code/corpus headings. Multi-label counts measure literature coverage.</desc><rect x="0" y="0" width="1200" height="980" rx="0" fill="#f7f9fa" stroke="#f7f9fa"/><rect x="0" y="0" width="1200" height="120" rx="0" fill="#f7f9fa" stroke="#f7f9fa"/><text x="32" y="48" fill="#102d3b" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700">Training-data quality: thirteen headings</text><text x="32" y="86" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">RQ2 / 165 paper–heading memberships from 78 papers</text><text x="32" y="148" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">CODE ATTRIBUTES</text><rect x="32" y="168" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="50" y="201" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Correctness</text><text x="502" y="204" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">21</text><rect x="32" y="272" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="50" y="305" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Security</text><text x="502" y="308" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">13</text><rect x="32" y="376" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="50" y="409" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Compliance</text><text x="502" y="412" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">6</text><rect x="32" y="480" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="50" y="513" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Robustness</text><text x="502" y="516" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">2</text><rect x="32" y="584" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="50" y="617" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Maintainability</text><text x="502" y="620" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">8</text><rect x="32" y="688" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="50" y="721" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Understandability</text><text x="502" y="724" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">7</text><rect x="32" y="792" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="50" y="825" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Efficiency</text><text x="502" y="828" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">6</text><text x="616" y="148" fill="#94501f" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="700">NON-CODE AND CORPUS ATTRIBUTES</text><rect x="616" y="168" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="634" y="201" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Compliance and Security Risks</text><text x="634" y="226" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">(Textual)</text><text x="1086" y="204" fill="#94501f" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">5</text><rect x="616" y="272" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="634" y="305" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Distribution Imbalance Issues</text><text x="1086" y="308" fill="#94501f" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">29</text><rect x="616" y="376" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="634" y="409" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Redundancy Issues</text><text x="1086" y="412" fill="#94501f" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">16</text><rect x="616" y="480" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="634" y="513" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Inadequate Diversity</text><text x="1086" y="516" fill="#94501f" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">26</text><rect x="616" y="584" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="634" y="617" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Data Contamination Risks</text><text x="1086" y="620" fill="#94501f" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">7</text><rect x="616" y="688" width="552" height="88" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="634" y="721" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="600">Low-Value Data</text><text x="1086" y="724" fill="#94501f" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">19</text><text x="32" y="935" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400">Counts show supporting papers per heading; the operational codebook defines the boundaries.</text></svg>
