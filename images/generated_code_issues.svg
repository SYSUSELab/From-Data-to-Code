<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" role="img" aria-labelledby="title desc"><title id="title">Generated-code quality dimensions</title><desc id="desc">Eight final dimensions and their paper counts. Counts measure literature coverage, not defect prevalence.</desc><rect x="0" y="0" width="1200" height="770" rx="0" fill="#f7f9fa" stroke="#f7f9fa"/><rect x="0" y="0" width="1200" height="120" rx="0" fill="#f7f9fa" stroke="#f7f9fa"/><text x="32" y="48" fill="#102d3b" font-family="DejaVu Sans, sans-serif" font-size="30" font-weight="700">Generated-code quality: eight dimensions</text><text x="32" y="86" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">RQ1 / 195 paper–dimension memberships from 98 papers</text><rect x="32" y="134" width="552" height="125" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="52" y="169" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Correctness</text><text x="490" y="169" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">74</text><text x="52" y="204" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">Syntax, logic, API, and dependency failures.</text><rect x="616" y="134" width="552" height="125" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="636" y="169" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Security</text><text x="1074" y="169" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">27</text><text x="636" y="204" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">Weaknesses permitting exploitation or unsafe</text><text x="636" y="228" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">execution.</text><rect x="32" y="277" width="552" height="125" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="52" y="312" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Compliance</text><text x="490" y="312" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">14</text><text x="52" y="347" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">Licensing, privacy, harmful-content, and rights</text><text x="52" y="371" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">concerns.</text><rect x="616" y="277" width="552" height="125" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="636" y="312" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Robustness</text><text x="1074" y="312" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">11</text><text x="636" y="347" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">Failures under abnormal inputs or runtime</text><text x="636" y="371" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">disruptions.</text><rect x="32" y="420" width="552" height="125" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="52" y="455" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Maintainability</text><text x="490" y="455" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">23</text><text x="52" y="490" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">Structure and coupling that impede modification.</text><rect x="616" y="420" width="552" height="125" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="636" y="455" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Understandability</text><text x="1074" y="455" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">13</text><text x="636" y="490" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">Naming, comments, or expressions that obscure</text><text x="636" y="514" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">intent.</text><rect x="32" y="563" width="552" height="125" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="52" y="598" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Efficiency</text><text x="490" y="598" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">22</text><text x="52" y="633" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">Excessive runtime or memory for the required</text><text x="52" y="657" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">behavior.</text><rect x="616" y="563" width="552" height="125" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="636" y="598" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">Generation Derailment</text><text x="1074" y="598" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="700">11</text><text x="636" y="633" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">Repetition, truncation, verbosity, and instruction</text><text x="636" y="657" fill="#475569" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400">deviation.</text><text x="32" y="742" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400">Counts show supporting papers per dimension; papers can appear in several dimensions.</text></svg>
