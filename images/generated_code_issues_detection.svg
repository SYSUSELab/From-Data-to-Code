aVu Sans, sans-serif" font-size="21" font-weight="700">27</text><text x="64" y="455" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400">Human Review and Manual Inspection</text><text x="1050" y="455" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700">14</text><rect x="32" y="514" width="1136" height="172" rx="10" fill="#ffffff" stroke="#d9e2e8"/><text x="54" y="550" fill="#153e50" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700">Model-Based Detection</text><text x="64" y="587" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400">LLM-Based Evaluation</text><text x="1050" y="587" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700">10</text><text x="64" y="645" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400">Task-Specific Learned Detection</text><text x="1050" y="645" fill="#176b78" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700">3</text><text x="32" y="712" fill="#334155" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400">Numbers identify supporting papers, not effectiveness or complete issue coverage.</text></svg>
